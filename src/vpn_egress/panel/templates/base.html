<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Egress{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2026; --muted: #667085;
    --line: #e3e6eb; --accent: #2f6fde; --ok: #1f8a4c; --bad: #c2382f; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2027; --text: #e6e8eb; --muted: #98a2b3;
      --line: #2c323c; --accent: #6b9cf2; --ok: #4cc283; --bad: #f07167; --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 24px; height: 24px; }
  header nav { display: flex; align-items: center; gap: 18px; }
  header nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header nav a.active, header nav a:hover { color: var(--text); }
  input[type=text], input[type=url], input[type=date], textarea { font: inherit; font-size: 14px; color: var(--text);
           background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; min-height: 120px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .notice { border-left: 3px solid var(--ok); padding: 8px 12px; margin-bottom: 16px; background: var(--card); }
  .notice.bad { border-color: var(--bad); }
  .notice.warn { border-color: var(--warn); }
  .meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 8px 0; }
  .meter span { display: block; height: 100%; background: var(--ok); }
  .meter span.warn { background: var(--warn); } .meter span.bad { background: var(--bad); }
  .inline-fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 8px 0; }
  .inline-fields label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  td.center { text-align: center; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
  tr.removed td { opacity: 0.45; }
  td.actions, div.actions { white-space: nowrap; }
  td.actions form, div.actions form { display: inline; }
  tr.subrow td { border-top: none; padding-top: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .cardhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 16px; margin-bottom: 10px; align-items: end; }
  .fields label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .fields label.check { flex-direction: row; align-items: center; gap: 8px; }
  select { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button:disabled { opacity: 0.35; cursor: default; }
  table.format { width: auto; }
  table.format td { border-top: none; padding: 3px 24px 3px 0; }
  [hidden] { display: none !important; }
  section.item { padding: 10px 16px; margin-bottom: 8px; }
  .qr svg { display: block; width: min(320px, 100%); height: auto; background: #fff; border-radius: 6px; }
  a.link { color: var(--accent); text-decoration: none; padding: 4px 6px; font-size: 15px; }
  section.item .editor { margin-top: 12px; }
  .summary { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .help { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px;
          border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 10px;
          cursor: help; margin-left: 4px; }
  tr.removed input { text-decoration: line-through; }
  header .who { color: var(--muted); font-size: 14px; display: flex; gap: 12px; align-items: center; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; border-top: none; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nowrap { white-space: nowrap; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .scroll { overflow-x: auto; }
  button, a.button { font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none; }
  a { color: var(--accent); }
  a.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main.landing { text-align: center; padding-top: 22vh; }
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
// [data-open="#id"] shows a hidden editor and hides itself; [data-cancel]
// resets the form, hides the editor and brings the opener back.
document.addEventListener("click", function (ev) {
  const open = ev.target.closest("[data-open]");
  if (open) {
    const box = document.querySelector(open.dataset.open);
    if (box) {
      box.hidden = false;
      open.hidden = true;
      const first = box.querySelector("input:not([type=hidden]), textarea");
      if (first) first.focus();
    }
    return;
  }
  const cancel = ev.target.closest("[data-cancel]");
  if (cancel) {
    const box = cancel.closest("[id]");
    const form = cancel.closest("form");
    if (form) {
      form.reset();
      form.querySelectorAll("select").forEach(function (s) { s.dispatchEvent(new Event("change")); });
    }
    if (box) {
      box.hidden = true;
      const opener = document.querySelector('[data-open="#' + box.id + '"]');
      if (opener) opener.hidden = false;
    }
  }
});
</script>
</body>
</html>
